name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    name: Install and run all tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer tests (temporary home folders)
        run: python tests/test_install.py
      - name: Install into the runner's ~/.claude
        run: python install.py --no-agents
      - name: Hook tests
        run: |
          python ~/.claude/hubs/test_ladder_hook.py
          python ~/.claude/hubs/test_test_filter_hook.py
          python ~/.claude/hubs/test_session_log_hook.py
          python ~/.claude/hubs/test_advisor.py
      - name: Skill self-test
        run: bash ~/.claude/skills/god-mode/scripts/selftest.sh
